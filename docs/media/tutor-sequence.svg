<path d="M392 620 H144" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
<text x="268.0" y="606" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle">Stream answer (SSE)</text>
<path d="M392 718 H1136" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="764.0" y="704" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle">Save messages with slide references</text>
<text x="40" y="858" font-size="20" font-weight="400" fill="#59636e" text-anchor="start">Cloud models receive relevant study context. Ollama inference stays on the Mac.</text>
</g></svg>
