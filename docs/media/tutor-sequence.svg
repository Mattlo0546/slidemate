<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc"><title id="title">A question through SlideMate</title><desc id="desc">A student asks about a slide. The interface sends slide context to the local API, which resumes a provider session, streams the answer and saves it locally.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#426393"/></marker></defs><rect width="1280" height="680" rx="20" fill="#f2f5fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" font-size="29" font-weight="700" fill="#213650" text-anchor="start">A question, from slide to saved answer</text><rect x="24" y="82" width="182" height="54" rx="11" fill="#173b70"/><text x="115" y="115" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Student</text><path d="M115 138 V620" stroke="#c2cee0" stroke-dasharray="5 6"/><rect x="234" y="82" width="182" height="54" rx="11" fill="#173b70"/><text x="325" y="115" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Slide viewer</text><path d="M325 138 V620" stroke="#c2cee0" stroke-dasharray="5 6"/><rect x="444" y="82" width="182" height="54" rx="11" fill="#173b70"/><text x="535" y="115" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Local API</text><path d="M535 138 V620" stroke="#c2cee0" stroke-dasharray="5 6"/><rect x="654" y="82" width="182" height="54" rx="11" fill="#173b70"/><text x="745" y="115" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Provider session</text><path d="M745 138 V620" stroke="#c2cee0" stroke-dasharray="5 6"/><rect x="864" y="82" width="182" height="54" rx="11" fill="#173b70"/><text x="955" y="115" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">AI / Ollama</text><path d="M955 138 V620" stroke="#c2cee0" stroke-dasharray="5 6"/><rect x="1074" y="82" width="182" height="54" rx="11" fill="#173b70"/><text x="1165" y="115" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Local files</text><path d="M1165 138 V620" stroke="#c2cee0" stroke-dasharray="5 6"/><path d="M115 190 L325 190" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="220.0" y="178" font-size="16" font-weight="400" fill="#213650" text-anchor="middle">Ask about this slide</text><path d="M325 252 L535 252" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="430.0" y="240" font-size="16" font-weight="400" fill="#213650" text-anchor="middle">Question + slide + image</text><path d="M535 314 L745 314" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="640.0" y="302" font-size="16" font-weight="400" fill="#213650" text-anchor="middle">Resume deck + notes context</text><path d="M745 376 L955 376" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="850.0" y="364" font-size="16" font-weight="400" fill="#213650" text-anchor="middle">Prime or continue conversation</text><path d="M955 438 L535 438" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="6 5"/><text x="745.0" y="426" font-size="16" font-weight="400" fill="#213650" text-anchor="middle">Stream text, tool activity and usage</text><path d="M535 500 L325 500" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="6 5"/><text x="430.0" y="488" font-size="16" font-weight="400" fill="#213650" text-anchor="middle">Server-sent events → answer</text><path d="M535 562 L1165 562" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="850.0" y="550" font-size="16" font-weight="400" fill="#213650" text-anchor="middle">Persist messages + slide references</text><text x="36" y="650" font-size="17" font-weight="400" fill="#536680" text-anchor="start">Cloud providers receive relevant study context; an Ollama model runs locally.</text></g></svg>
