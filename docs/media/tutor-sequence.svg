<text x="268.0" y="216" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle">Question + slide + image</text>
<path d="M392 308 H640" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="516.0" y="294" font-size="19" font-weight="400" fill="#1f2328" text-anchor="middle">Deck + notes context</text>
