<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="890" viewBox="0 0 1280 890" role="img" aria-labelledby="title desc">
<title id="title">A slide question through SlideMate</title><desc id="desc">The slide viewer sends context to the local API and provider session. The model streams events back through the session and API; chat files preserve the conversation.</desc>
<rect width="1280" height="890" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8c959f" stroke-width="1.5"/></marker></defs>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="40" y="43" font-size="24" font-weight="500" fill="#1f2328" text-anchor="start">Tutor / request lifecycle</text>
<rect x="40" y="86" width="208" height="84" rx="7" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="144.0" y="119" font-size="21" font-weight="600" fill="#1f2328" text-anchor="middle">Slide viewer</text>
<text x="144.0" y="147" font-size="17" font-weight="400" fill="#59636e" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">PDF.js</text>
<path d="M144 172 V810" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 5"/>
<rect x="288" y="86" width="208" height="84" rx="7" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="392.0" y="119" font-size="21" font-weight="600" fill="#1f2328" text-anchor="middle">Local API</text>
<text x="392.0" y="147" font-size="17" font-weight="400" fill="#59636e" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">server.py</text>
<path d="M392 172 V810" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 5"/>
<rect x="536" y="86" width="208" height="84" rx="7" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="640.0" y="119" font-size="21" font-weight="600" fill="#1f2328" text-anchor="middle">Deck session</text>
<text x="640.0" y="147" font-size="17" font-weight="400" fill="#59636e" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">providers.py</text>
