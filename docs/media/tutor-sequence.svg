<text x="888.0" y="119" font-size="21" font-weight="600" fill="#1f2328" text-anchor="middle">AI / Ollama</text>
<text x="888.0" y="147" font-size="17" font-weight="400" fill="#59636e" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">selected model</text>
<path d="M888 172 V810" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 5"/>
<rect x="1032" y="86" width="208" height="84" rx="7" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="1136.0" y="119" font-size="21" font-weight="600" fill="#1f2328" text-anchor="middle">Chat files</text>
<text x="1136.0" y="147" font-size="17" font-weight="400" fill="#59636e" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">local JSON</text>
