<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">SlideMate. Less study admin. More understanding.</title><desc id="desc">Your slides, AI tutor, lecture notes and flashcards in one Mac app. A white square mascot with two black eyes.</desc>
