<text x="64" y="77" fill="#fff" font-size="27" font-weight="700" letter-spacing="-1">SlideMate</text>
<text x="64" y="150" fill="#b4c7eb" font-size="15" letter-spacing="2.5">YOUR WHOLE STUDY DAY. ONE MAC APP.</text>
<text x="60" y="232" fill="#fff" font-size="66" font-weight="700" letter-spacing="-2.7">Less study admin.</text>
<text x="60" y="309" fill="#b7d7ff" font-size="66" font-weight="700" letter-spacing="-2.7">More understanding.</text>
<text x="64" y="370" fill="#d4deef" font-size="23">Slides, a tutor, lecture notes and flashcards.</text>
<text x="64" y="405" fill="#d4deef" font-size="23">All the little things, already connected.</text>
