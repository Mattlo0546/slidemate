<text x="350" y="516" fill="#b4c7eb" font-size="18">Built for macOS</text>
<text x="624" y="516" fill="#b4c7eb" font-size="18">Bring your AI account</text>
<text x="985" y="516" fill="#b4c7eb" font-size="18">Make it click.</text>
