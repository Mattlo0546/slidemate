<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc"><title id="title">From lecture to revision</title><desc id="desc">Recorded audio or imported transcripts produce grounded slide notes. Notes feed the tutor and trigger flashcards; student questions add targeted cards, and FSRS schedules reviews.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#426393"/></marker></defs><rect width="1280" height="650" rx="20" fill="#f2f5fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="49" font-size="29" font-weight="700" fill="#213650" text-anchor="start">From what the lecturer said to what you remember</text><rect x="36" y="100" width="265" height="110" rx="12" fill="#fff" stroke="#ccd8e9"/><text x="54" y="132" font-size="20" font-weight="700" fill="#213650" text-anchor="start">Record locally</text><text x="54" y="160" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Audio chunks + slide events</text><text x="54" y="184" font-size="16" font-weight="400" fill="#536680" text-anchor="start">ffmpeg → Parakeet MLX</text><rect x="36" y="220" width="265" height="110" rx="12" fill="#fff" stroke="#ccd8e9"/><text x="54" y="252" font-size="20" font-weight="700" fill="#213650" text-anchor="start">Or import a transcript</text><text x="54" y="280" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Text or timed captions</text><text x="54" y="304" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Existing lecture-capture output</text><rect x="361" y="175" width="265" height="110" rx="12" fill="#fff" stroke="#ccd8e9"/><text x="379" y="207" font-size="20" font-weight="700" fill="#213650" text-anchor="start">Numbered transcript</text><text x="379" y="235" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Sentences + timestamps</text><text x="379" y="259" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Slide-view hints when available</text><path d="M301 155 L361 210" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M301 275 L361 250" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="686" y="175" width="265" height="110" rx="12" fill="#fff" stroke="#ccd8e9"/><text x="704" y="207" font-size="20" font-weight="700" fill="#213650" text-anchor="start">Generate lecture notes</text><text x="704" y="235" font-size="16" font-weight="400" fill="#536680" text-anchor="start">AI summary + slide mapping</text><text x="704" y="259" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Selected transcript line ranges</text><path d="M626 230 L686 230" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="1011" y="175" width="233" height="110" rx="12" fill="#fff" stroke="#ccd8e9"/><text x="1029" y="207" font-size="20" font-weight="700" fill="#213650" text-anchor="start">Ground the quotes</text><text x="1029" y="235" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Rebuild excerpts from</text><text x="1029" y="259" font-size="16" font-weight="400" fill="#536680" text-anchor="start">stored transcript lines</text><path d="M951 230 L1011 230" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="686" y="345" width="265" height="110" rx="12" fill="#fff" stroke="#ccd8e9"/><text x="704" y="377" font-size="20" font-weight="700" fill="#213650" text-anchor="start">Save notes + Markdown</text><text x="704" y="405" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Feed lecture context to tutor</text><text x="704" y="429" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Trigger the flashcard worker</text><path d="M819 285 L819 345" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="36" y="345" width="265" height="110" rx="12" fill="#fff" stroke="#ccd8e9"/><text x="54" y="377" font-size="20" font-weight="700" fill="#213650" text-anchor="start">Your tutor questions</text><text x="54" y="405" font-size="16" font-weight="400" fill="#536680" text-anchor="start">What needed explaining</text><text x="54" y="429" font-size="16" font-weight="400" fill="#536680" text-anchor="start">New questions after revision</text><rect x="361" y="345" width="265" height="110" rx="12" fill="#fff" stroke="#ccd8e9"/><text x="379" y="377" font-size="20" font-weight="700" fill="#213650" text-anchor="start">Build / update cards</text><text x="379" y="405" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Slides + notes + questions</text><text x="379" y="429" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Subtopics and exam hints</text><path d="M301 400 L361 400" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M686 400 L626 400" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="361" y="505" width="590" height="95" rx="12" fill="#e0edea" stroke="#ccd8e9"/><text x="379" y="537" font-size="20" font-weight="700" fill="#213650" text-anchor="start">Review with FSRS-5</text><text x="379" y="565" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Edit cards · schedule the next review · export to Anki</text><path d="M494 455 L494 505" stroke="#426393" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="36" y="630" font-size="16" font-weight="400" fill="#536680" text-anchor="start">Transcript quotes are traceable to ASR output; students can inspect the passage and replay available audio.</text></g></svg>
