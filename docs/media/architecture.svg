<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">SlideMate architecture</title><desc id="desc">A Swift shell and study UI call a local Python service. Library, tutor, lecture and flashcard components use local storage. AI providers and university systems are external; Parakeet and optional Ollama run locally. A Swift helper sends selected images to iPad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7b8ca7"/></marker></defs><rect width="1280" height="900" rx="24" fill="#f2f5fb"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="56" font-size="32" fill="#172840" font-weight="700">A Mac app. An inspectable system.</text><text x="40" y="89" font-size="20" fill="#536680" font-weight="400">Local study data, explicit connections to the services you choose.</text><rect x="30" y="118" width="860" height="738" rx="18" fill="#e9eff9" stroke="#cbd7e9"/><text x="52" y="153" font-size="14" fill="#43639a" font-weight="700">ON YOUR MAC</text><rect x="52" y="174" width="816" height="88" rx="14" fill="#fff" stroke="#d7dfed"/><text x="76" y="208" font-size="23" fill="#172840" font-weight="700">Swift / AppKit shell + WKWebView</text><text x="76" y="239" font-size="18" fill="#536680" font-weight="400">PDF.js viewer · slide-aware chat · recording · flashcard review</text><path d="M460 264 L460 304" stroke="#7b8ca7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="482" y="290" font-size="16" fill="#536680" font-weight="400">HTTP + server-sent events</text><rect x="52" y="306" width="816" height="80" rx="14" fill="#173b70" stroke="#173b70"/><text x="76" y="339" font-size="24" fill="#fff" font-weight="700">Python orchestration service</text><text x="76" y="369" font-size="18" fill="#c7daf7" font-weight="400">Loopback HTTP · sessions · background jobs · lifecycle</text><path d="M150 387 L150 424" stroke="#7b8ca7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M355 387 L355 424" stroke="#7b8ca7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M560 387 L560 424" stroke="#7b8ca7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765 387 L765 424" stroke="#7b8ca7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="52" y="426" width="192" height="124" rx="14" fill="#fff" stroke="#d7dfed"/><text x="68" y="459" font-size="21" fill="#172840" font-weight="700">Library</text><text x="68" y="494" font-size="15" fill="#536680" font-weight="400">Course / type / week</text><text x="68" y="521" font-size="15" fill="#536680" font-weight="400">Chats + Markdown</text><rect x="260" y="426" width="192" height="124" rx="14" fill="#fff" stroke="#d7dfed"/><text x="276" y="459" font-size="21" fill="#172840" font-weight="700">AI adapters</text><text x="276" y="494" font-size="15" fill="#536680" font-weight="400">Deck context</text><text x="276" y="521" font-size="15" fill="#536680" font-weight="400">Streaming + resume</text><rect x="468" y="426" width="192" height="124" rx="14" fill="#fff" stroke="#d7dfed"/><text x="484" y="459" font-size="21" fill="#172840" font-weight="700">Lectures</text><text x="484" y="494" font-size="15" fill="#536680" font-weight="400">Transcript + quotes</text><text x="484" y="521" font-size="15" fill="#536680" font-weight="400">Slide-linked notes</text><rect x="676" y="426" width="192" height="124" rx="14" fill="#fff" stroke="#d7dfed"/><text x="692" y="459" font-size="21" fill="#172840" font-weight="700">Flashcards</text><text x="692" y="494" font-size="15" fill="#536680" font-weight="400">Study-driven cards</text><text x="692" y="521" font-size="15" fill="#536680" font-weight="400">FSRS-5 reviews</text><path d="M564 552 L564 584" stroke="#7b8ca7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M356 552 L356 584" stroke="#7b8ca7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="52" y="586" width="398" height="83" rx="14" fill="#e0edea" stroke="#bad6cf"/><text x="72" y="619" font-size="21" fill="#172840" font-weight="700">Optional local inference</text><text x="72" y="649" font-size="17" fill="#40675e" font-weight="400">Ollama · text and vision models</text><rect x="468" y="586" width="400" height="83" rx="14" fill="#e0edea" stroke="#bad6cf"/><text x="488" y="619" font-size="21" fill="#172840" font-weight="700">Local speech recognition</text><text x="488" y="649" font-size="17" fill="#40675e" font-weight="400">ffmpeg + Parakeet MLX · Apple Silicon</text><rect x="52" y="700" width="816" height="132" rx="14" fill="#fff" stroke="#d7dfed"/><text x="76" y="738" font-size="23" fill="#172840" font-weight="700">Your study data</text><text x="76" y="770" font-size="18" fill="#536680" font-weight="400">PDFs · chats · recordings · transcripts · notes · review state</text><text x="76" y="802" font-size="18" fill="#536680" font-weight="400">JSON persistence + portable Markdown / Anki exports</text><text x="925" y="153" font-size="14" fill="#43639a" font-weight="700">EXTERNAL CONNECTIONS</text><rect x="922" y="174" width="328" height="152" rx="14" fill="#fff" stroke="#d7dfed"/><text x="942" y="210" font-size="23" fill="#172840" font-weight="700">Your AI provider</text><text x="942" y="243" font-size="18" fill="#536680" font-weight="400">Signed-in CLI adapters</text><text x="942" y="272" font-size="18" fill="#536680" font-weight="400">Study context goes out;</text><text x="942" y="299" font-size="18" fill="#536680" font-weight="400">generated answers return.</text><rect x="922" y="354" width="328" height="172" rx="14" fill="#fff" stroke="#d7dfed"/><text x="942" y="389" font-size="23" fill="#172840" font-weight="700">Your university</text><text x="942" y="422" font-size="18" fill="#536680" font-weight="400">MCP connectors</text><text x="942" y="453" font-size="17" fill="#536680" font-weight="400">Canvas · Moodle · Blackboard</text><text x="942" y="483" font-size="17" fill="#536680" font-weight="400">Google Classroom</text><text x="942" y="508" font-size="15" fill="#536680" font-weight="400">Pull materials / enabled tutor tools</text><rect x="922" y="554" width="328" height="137" rx="14" fill="#fff" stroke="#d7dfed"/><text x="942" y="589" font-size="23" fill="#172840" font-weight="700">Your iPad</text><text x="942" y="622" font-size="18" fill="#536680" font-weight="400">Swift AirDrop helper</text><text x="942" y="653" font-size="17" fill="#536680" font-weight="400">Named recipient + clipboard</text><rect x="922" y="719" width="328" height="113" rx="14" fill="#fff" stroke="#d7dfed"/><text x="942" y="754" font-size="23" fill="#172840" font-weight="700">Setup &amp; updates</text><text x="942" y="787" font-size="18" fill="#536680" font-weight="400">Tool / model downloads</text><text x="942" y="813" font-size="18" fill="#536680" font-weight="400">GitHub release checks</text><path d="M870 346 L902 346" stroke="#7b8ca7" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M902 250 V622 M902 250 H918 M902 440 H918 M902 622 H918" stroke="#7b8ca7" stroke-width="2" fill="none"/><text x="40" y="883" font-size="16" fill="#536680" font-weight="400">Solid blocks show components; the detailed data flows and trust boundaries are documented below.</text></g></svg>
