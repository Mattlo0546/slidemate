<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
<title id="title">SlideMate system architecture</title><desc id="desc">A native Swift shell hosts a PDF.js web view. A loopback Python API coordinates local files, university connectors, provider sessions, lectures and revision. Dashed boxes identify university services, cloud AI and the iPad. Ollama and Parakeet run locally.</desc>
