name: release
# Push a tag like v0.1.0 → GitHub builds SlideMate.app (universal) and publishes it as a Release download.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      # Optional: with an Apple Developer ID certificate in the repo's secrets, the download is signed and notarised
      # and opens with no Gatekeeper prompt. Without the secrets, it's ad-hoc signed as before.
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC" && security set-keychain-settings -lut 3600 "$KC" && security unlock-keychain -p "$KP" "$KC"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
      - name: Build universal app, zip and disk image
        env:
          SLIDEMATE_SIGN_ID: ${{ secrets.DEVELOPER_ID_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/build-app.sh --zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          # Version notes first: the in-app update dialog shows the release body up to "### Install".
          : > "$NOTES"
          VERSION_NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$VERSION_NOTES" ]; then
            cat "$VERSION_NOTES" >> "$NOTES"
            printf '\n\n' >> "$NOTES"
          fi
          cat .github/release-notes/installation.md >> "$NOTES"
          gh release create "$GITHUB_REF_NAME" dist/SlideMate-*-macOS.zip dist/SlideMate-*-macOS.dmg \
            --title "SlideMate ${GITHUB_REF_NAME}" --notes-file "$NOTES" --generate-notes
